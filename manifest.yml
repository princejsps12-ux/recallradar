modules:
  jira:issuePanel:
    - key: recallradar-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: RecallRadar
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2e0464e9-8b4a-4388-b224-b4f05eae484f
