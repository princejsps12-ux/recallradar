modules:
  jira:issuePanel:
    - key: recallradar-hello-world-panel
      resource: main
      resolver:
        function: resolver
      viewportSize: medium
      title: RecallRadar
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
  rovo:agent:
    - key: recallradar-assistant
      name: RecallRadar Assistant
      description: Test agent for RecallRadar. Greets the user using its hello action.
      prompt: >
        You are the RecallRadar Assistant. When the user says hello or asks you
        to test, call the hello action and reply with exactly what it returns.
      conversationStarters:
        - Say hello
      actions:
        - hello-action
  action:
    - key: hello-action
      name: Say hello
      function: hello-fn
      actionVerb: GET
      description: Returns a greeting from RecallRadar. Use it when the user says
        hello or asks to test the agent.
  # The recall check runs in the background: the button queues it, this consumer does it.
  # Only queue consumers and scheduled triggers may set timeoutSeconds (UI functions are fixed
  # at 25 s), which is exactly why the check lives here.
  consumer:
    - key: check-consumer
      queue: recall-check
      function: check-consumer-fn
  # Refreshes the saved result once a day so it is usually ready before anyone clicks.
  scheduledTrigger:
    - key: daily-refresh
      function: daily-refresh-fn
      interval: day
  function:
    - key: resolver
      handler: index.handler
    - key: hello-fn
      handler: index.hello
    - key: check-consumer-fn
      handler: consumer.handler
      timeoutSeconds: 300
    - key: daily-refresh-fn
      handler: scheduled.handler
      timeoutSeconds: 300
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:jira-work
    - read:servicedesk-request
    - read:cmdb-object:jira
    - read:cmdb-schema:jira
    - storage:app
  external:
    fetch:
      backend:
        - address: api.fda.gov
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2e0464e9-8b4a-4388-b224-b4f05eae484f
