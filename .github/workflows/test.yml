# Everything that can be checked without an Atlassian site: lint, the type check (JSDoc with checkJs; the core modules strictly), the
# unit tests, the production build of the Custom UI,
# the jsdom smoke test of the real panel and dashboard, and the real-browser preview check (content security policy,
# console errors, accessibility, panel height; see scripts/preview/README.md).
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --legacy-peer-deps
        working-directory: static/ui
      - run: npm run build
        working-directory: static/ui
        env:
          CI: 'false'
      - run: npm run test:ui
      - run: npm run test:preview
        env:
          CHROME: /usr/bin/google-chrome
